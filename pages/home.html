<!DOCTYPE html>
<html lang="en">

<head>
    <title>Fodecorses - Home </title>
    <link rel="stylesheet" href="../styles/home-style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-code"></i>
            <span>FodeCorses</span>
        </div>
        <nav class="nav-links">
            <a href="home.html" class="active"><i class="fa-solid fa-house"></i> Problemset</a>
            <a href="submission.html"><i class="fa-solid fa-trophy"></i> My Submissions</a>
            <a href="Standings.html"><i class="fa-solid fa-chart-bar"></i> Standings</a>
            <a href="submission.html"><i class="fa-solid fa-circle-info"></i> Status</a>
        </nav>
        <div class="auth-buttons">
            <a href="login.html" class="btn-login"><i class="fa-solid fa-user"></i> Login</a>
            <a href="signup.html" class="btn-register"><i class="fa-solid fa-user-plus"></i> Register</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">

        <!-- Header Banner Section -->
        <section class="banner">
            <div class="banner-content">
                <h1>
                    <span class="icon-box"><i class="fa-solid fa-terminal"></i></span>
                    Problemset
                </h1>
                <p><i class="fa-solid fa-wand-magic-sparkles"></i> Sharpen your skills. Solve more problems.</p>
            </div>

        </section>

        <!-- Add Problem Button -->
        <div class="actions-bar">
            <button class="btn-add"><i class="fa-solid fa-plus"></i> Add problem</button>
        </div>

        <!-- Problems List -->
        <div class="problems-list">

            <!-- Problem 1 -->
            <div class="problem-card">
                <div class="problem-info">
                    <h3>A. Can solve it ?</h3>
                    <div class="problem-meta">
                        <span class="badge easy"><i class="fa-solid fa-chart-simple"></i> Easy</span>
                        <span class="badge time"><i class="fa-regular fa-clock"></i> 1.0s</span>
                    </div>
                </div>
                <div class="problem-actions">
                    <button class="btn-action try"><i class="fa-solid fa-play"></i> Try</button>
                    <button class="btn-action edit"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn-action delete"><i class="fa-regular fa-trash-can"></i> Delete</button>
                </div>
            </div>

            <!-- Problem 2 -->
            <div class="problem-card">
                <div class="problem-info">
                    <h3>B. Way Too Long Words</h3>
                    <div class="problem-meta">
                        <span class="badge easy"><i class="fa-solid fa-chart-simple"></i> Easy</span>
                        <span class="badge time"><i class="fa-regular fa-clock"></i> 1.0s</span>
                    </div>
                </div>
                <div class="problem-actions">
                    <button class="btn-action try"><i class="fa-solid fa-play"></i> Try</button>
                    <button class="btn-action edit"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn-action delete"><i class="fa-regular fa-trash-can"></i> Delete</button>
                </div>
            </div>

            <!-- Problem 3 -->
            <div class="problem-card">
                <div class="problem-info">
                    <h3>C. String Task</h3>
                    <div class="problem-meta">
                        <span class="badge easy"><i class="fa-solid fa-chart-simple"></i> Easy</span>
                        <span class="badge time"><i class="fa-regular fa-clock"></i> 1.0s</span>
                    </div>
                </div>
                <div class="problem-actions">
                    <button class="btn-action try"><i class="fa-solid fa-play"></i> Try</button>
                    <button class="btn-action edit"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn-action delete"><i class="fa-regular fa-trash-can"></i> Delete</button>
                </div>
            </div>

            <!-- Problem 4 -->
            <div class="problem-card">
                <div class="problem-info">
                    <h3>D. Graph Theory</h3>
                    <div class="problem-meta">
                        <span class="badge easy"><i class="fa-solid fa-chart-simple"></i> Easy</span>
                        <span class="badge time"><i class="fa-regular fa-clock"></i> 1.0s</span>
                    </div>
                </div>
                <div class="problem-actions">
                    <button class="btn-action try"><i class="fa-solid fa-play"></i> Try</button>
                    <button class="btn-action edit"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn-action delete"><i class="fa-regular fa-trash-can"></i> Delete</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <i class="fa-solid fa-code"></i>
        <p>© 2026 Fodecorses. All rights reserved.</p>
    </footer>

</body>

</html>
